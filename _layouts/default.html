<!DOCTYPE html>
<html lang="ko">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-top">
      <div class="shell site-top-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-text">{{ site.title | escape }}</span>
        </a>
        <div class="top-actions">
          <nav class="top-nav" aria-label="주 메뉴">
            <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>홈</a>
            <a href="{{ '/categories/development/' | relative_url }}"{% if page.url contains '/categories/' %} aria-current="page"{% endif %}>카테고리</a>
            <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          </nav>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-label="다크모드 전환" title="테마 변경">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="main" class="shell" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell site-footer-inner">

        <a class="footer-brand-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <p>{{ site.data.profile.name | default: '윤도현' | escape }} · {{ site.description | escape }}</p>
        <div class="footer-links">
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </div>
      </div>
    </footer>
    <script src="{{ '/assets/study.js' | relative_url }}" defer></script>
  </body>
</html>
