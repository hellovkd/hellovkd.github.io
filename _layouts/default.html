<!DOCTYPE html>
<html lang="ko">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-top">
      <div class="shell site-top-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-text">{{ site.title | escape }}</span>
        </a>
        <div class="top-actions">
          <nav class="top-nav" aria-label="주 메뉴">
            <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>홈</a>
            <a href="{{ '/#projects' | relative_url }}">작업물</a>
            <a href="{{ '/#posts' | relative_url }}">기록</a>
            <a href="{{ '/categories/development/' | relative_url }}"{% if page.url contains '/categories/' %} aria-current="page"{% endif %}>분류</a>
            <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          </nav>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-label="다크모드로 전환" title="다크모드로 전환">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
              <path d="M13 3h-2v2h2V3zm4 2h2v2h-2V5zm-6 6h2v2h-2v-2zm-8 0h2v2H3v-2zm18 0h-2v2h2v-2zM5 5h2v2H5V5zm14 14h-2v-2h2v2zm-8 2h2v-2h-2v2zm-4-2H5v-2h2v2zM9 7h6v2H9V7zm0 8H7V9h2v6zm0 0v2h6v-2h2V9h-2v6H9z"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
              <path d="M6 2h8v2h-2v2h-2V4H6V2ZM4 6V4h2v2H4Zm0 10H2V6h2v10Zm2 2H4v-2h2v2Zm2 2H6v-2h2v2Zm10 0v2H8v-2h10Zm2-2v2h-2v-2h2Zm-2-4h2v4h2v-8h-2v2h-2v2Zm-6 0v2h6v-2h-6Zm-2-2h2v2h-2v-2Zm0 0V6H8v6h2Z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="main" class="shell" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell site-footer-inner">
        <div class="footer-colophon">
          <a class="footer-brand-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
          <p>{{ site.data.profile.name | default: '윤도현' | escape }} · {{ site.description | escape }}</p>
        </div>
        <div class="footer-actions">
          {% assign profile = site.data.profile %}
          {% include social-links.html %}
          <a class="footer-rss" href="{{ '/feed.xml' | relative_url }}">RSS 구독</a>
        </div>
      </div>
    </footer>
    <script src="{{ '/assets/study.js' | relative_url }}" defer></script>
  </body>
</html>
