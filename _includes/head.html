<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <script>
    (function() {
      var saved;
      try { saved = localStorage.getItem('study-theme'); } catch (_) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var sameOriginRef = false;
      try {
        sameOriginRef = Boolean(document.referrer && new URL(document.referrer).origin === location.origin);
      } catch (_) {}
      var navEntry = window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var isReload = navEntry && navEntry.type === 'reload';
      if (!reduced && (!sameOriginRef || isReload)) {
        document.documentElement.classList.add('is-booting');
      }
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/study.css' | relative_url }}">
  {% if page.layout == 'home' %}<link rel="stylesheet" href="{{ '/assets/desk.css' | relative_url }}">{% endif %}
  {% feed_meta %}
</head>
