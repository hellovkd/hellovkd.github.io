<div class="social-logos" aria-label="외부 채널">
  {% for link in profile.links %}
    {% assign lname = link.name | downcase %}
    <a class="social-logo-link" href="{{ link.url }}" target="_blank" rel="noopener" aria-label="{{ link.name | escape }}" title="{{ link.name | escape }}">
      {% if lname contains 'github' %}
        <svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <path d="M5 2h4v2H7v2H5V2Zm0 10H3V6h2v6Zm2 2H5v-2h2v2Zm2 2v-2H7v2H3v-2H1v2h2v2h4v4h2v-4h2v-2H9Zm0 0v2H7v-2h2Zm6-12v2H9V4h6Zm4 2h-2V4h-2V2h4v4Zm0 6V6h2v6h-2Zm-2 2v-2h2v2h-2Zm-2 2v-2h2v2h-2Zm0 2h-2v-2h2v2Zm0 0h2v4h-2v-4Z"/>
        </svg>
      {% elsif lname contains 'notion' %}
        <svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <path d="M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h3v2h2v2h2v2h1V7h2v10h-3v-2h-2v-2h-2v-2H9v6H7V7z"/>
        </svg>
      {% elsif lname contains 'velog' %}
        <svg viewBox="0 0 24 24" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <path d="M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h3v4h2v4h2v-4h2V7h2v4h-2v4h-2v2h-3v-2H9v-4H7V7z"/>
        </svg>
      {% endif %}
    </a>
  {% endfor %}
</div>
